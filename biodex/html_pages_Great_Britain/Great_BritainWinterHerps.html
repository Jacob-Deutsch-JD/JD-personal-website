/a><a href="Great_BritainWinterSeaweeds.html">Seaweeds</a><a href="Great_BritainWinterOther.html">Other</a></div></div></nav><div style="text-align: center;"><button onclick="selectWinterHerpsMain()">Main</button><button onclick="selectWinterHerpsCryptic()">Cryptic</button><button onclick="selectWinterHerpsOther()">Other</button></div><div style="display: flex; flex-wrap: wrap;"><div id="WinterHerpsMainSection" style="display: block; width: 100%;"></div><div id="WinterHerpsCrypticSection" style="display: block; width: 100%;"></div><div id="WinterHerpsOtherSection" style="display: block; width: 100%;"></div></div>
				<script>
				
		var hour = new Date().getHours();
		var backgroundClass = (hour >= 6 && hour < 18) ? 'day' : 'night';
		var h1Class = (hour >= 6 && hour < 18) ? 'h1day' : 'h1night';
		document.body.classList.add(backgroundClass);

		document.querySelector('.dropbtn').addEventListener('click', function() {
			document.querySelector('.dropdown-content').classList.toggle('show');
		});

		// Close the dropdown if the user clicks outside of it
		window.onclick = function(event) {
			if (!event.target.matches('.dropbtn')) {
				var dropdowns = document.getElementsByClassName("dropdown-content");
				for (var i = 0; i < dropdowns.length; i++) {
					var openDropdown = dropdowns[i];
					if (openDropdown.classList.contains('show')) {
						openDropdown.classList.remove('show');
					}
				}
			}
		}
	

				function selectWinterHerpsMain() {
					document.getElementById('WinterHerpsMainSection').style.display = 'block';
					document.getElementById('WinterHerpsCrypticSection').style.display = 'none';
					document.getElementById('WinterHerpsOtherSection').style.display = 'none';
				}
				function selectWinterHerpsCryptic() {
					document.getElementById('WinterHerpsMainSection').style.display = 'none';
					document.getElementById('WinterHerpsCrypticSection').style.display = 'block';
					document.getElementById('WinterHerpsOtherSection').style.display = 'none';
				}
				function selectWinterHerpsOther() {
					document.getElementById('WinterHerpsMainSection').style.display = 'none';
					document.getElementById('WinterHerpsCrypticSection').style.display = 'none';
					document.getElementById('WinterHerpsOtherSection').style.display = 'block';
				}

				function getWeather(lat, lon) {
					var apiKey = '5a681d50320d318a92be7deca35dbc18';
					var url = 'https://api.openweathermap.org/data/2.5/weather?lat='+lat+'&lon='+lon+'&appid='+apiKey;

					fetch(url)
						.then(response => response.json())
						.then(data => {
							console.log(data);

						})
						.catch(error => {
							console.error('Error fetching weather data:', error);
						});
				}

				window.onload = function() {
					selectWinterHerpsMain();
				}
				</script>
