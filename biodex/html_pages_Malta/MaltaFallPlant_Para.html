ant_ParaMain()">Main</button><button onclick="selectFallPlant_ParaCryptic()">Cryptic</button><button onclick="selectFallPlant_ParaOther()">Other</button></div><div style="display: flex; flex-wrap: wrap;"><div id="FallPlant_ParaMainSection" style="display: block; width: 100%;"></div><div id="FallPlant_ParaCrypticSection" style="display: block; width: 100%;"></div><div id="FallPlant_ParaOtherSection" style="display: block; width: 100%;"></div></div>
				<script>
				
		var hour = new Date().getHours();
		var backgroundClass = (hour >= 6 && hour < 18) ? 'day' : 'night';
		var h1Class = (hour >= 6 && hour < 18) ? 'h1day' : 'h1night';
		document.body.classList.add(backgroundClass);

		document.querySelector('.dropbtn').addEventListener('click', function() {
			document.querySelector('.dropdown-content').classList.toggle('show');
		});

		// Close the dropdown if the user clicks outside of it
		window.onclick = function(event) {
			if (!event.target.matches('.dropbtn')) {
				var dropdowns = document.getElementsByClassName("dropdown-content");
				for (var i = 0; i < dropdowns.length; i++) {
					var openDropdown = dropdowns[i];
					if (openDropdown.classList.contains('show')) {
						openDropdown.classList.remove('show');
					}
				}
			}
		}
	

				function selectFallPlant_ParaMain() {
					document.getElementById('FallPlant_ParaMainSection').style.display = 'block';
					document.getElementById('FallPlant_ParaCrypticSection').style.display = 'none';
					document.getElementById('FallPlant_ParaOtherSection').style.display = 'none';
				}
				function selectFallPlant_ParaCryptic() {
					document.getElementById('FallPlant_ParaMainSection').style.display = 'none';
					document.getElementById('FallPlant_ParaCrypticSection').style.display = 'block';
					document.getElementById('FallPlant_ParaOtherSection').style.display = 'none';
				}
				function selectFallPlant_ParaOther() {
					document.getElementById('FallPlant_ParaMainSection').style.display = 'none';
					document.getElementById('FallPlant_ParaCrypticSection').style.display = 'none';
					document.getElementById('FallPlant_ParaOtherSection').style.display = 'block';
				}

				function getWeather(lat, lon) {
					var apiKey = '5a681d50320d318a92be7deca35dbc18';
					var url = 'https://api.openweathermap.org/data/2.5/weather?lat='+lat+'&lon='+lon+'&appid='+apiKey;

					fetch(url)
						.then(response => response.json())
						.then(data => {
							console.log(data);

						})
						.catch(error => {
							console.error('Error fetching weather data:', error);
						});
				}

				window.onload = function() {
					selectFallPlant_ParaMain();
				}
				</script>
